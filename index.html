<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel LAORTT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  /* Plano: faixa lateral azul-marinho com filete dourado duplo (os anéis do selo), área de trabalho clara, gaveta de edição à direita. */
  color-scheme: light;
  --bg:#eef0f4; --surface:#ffffff; --surface-2:#f6f7f9;
  --ink:#0f1a30; --ink-2:#44506a; --muted:#68728a;
  --line:#dde1ea; --line-2:#c7cedb;
  --side:#13224a; --side-ink:#e8ecf5; --side-muted:#9ea9c6; --side-hover:#1c2f60;
  --brand:#13224a; --brand-2:#22397a; --brand-ink:#13224a; --on-brand:#ffffff;
  --gold:#c9a55c; --gold-ink:#7a5a14; --gold-wash:#f5eedd; --gold-line:#d9c08a;
  --good:#1d7a3b; --good-wash:#e3f2e8; --warn:#8a5d00; --warn-wash:#fbf0d6; --bad:#b0302d; --bad-wash:#f8e3e2;
  --bar:#22397a; --bar-low:#b0302d; --track:#e9ecf2;
  --shadow:0 1px 2px rgba(15,26,48,.06), 0 6px 18px rgba(15,26,48,.07);
  --f-display:"Marcellus","Optima","Candara","Palatino Linotype",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0a1020; --surface:#111a2e; --surface-2:#17223a;
    --ink:#ecf0f7; --ink-2:#b3bccf; --muted:#8a94a9;
    --line:#233050; --line-2:#344267;
    --side:#0b1530; --side-ink:#e6eaf4; --side-muted:#8e9abb; --side-hover:#152450;
    --brand:#2b4386; --brand-2:#3a56a3; --brand-ink:#a9bdf0; --on-brand:#ffffff;
    --gold:#d4b46c; --gold-ink:#e0c47f; --gold-wash:#2a2414; --gold-line:#6b5726;
    --good:#5cc985; --good-wash:#11291b; --warn:#e6b450; --warn-wash:#2c2310; --bad:#f2817b; --bad-wash:#351719;
    --bar:#7f9be0; --bar-low:#f2817b; --track:#1c2742;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0a1020; --surface:#111a2e; --surface-2:#17223a;
  --ink:#ecf0f7; --ink-2:#b3bccf; --muted:#8a94a9;
  --line:#233050; --line-2:#344267;
  --side:#0b1530; --side-ink:#e6eaf4; --side-muted:#8e9abb; --side-hover:#152450;
  --brand:#2b4386; --brand-2:#3a56a3; --brand-ink:#a9bdf0; --on-brand:#ffffff;
  --gold:#d4b46c; --gold-ink:#e0c47f; --gold-wash:#2a2414; --gold-line:#6b5726;
  --good:#5cc985; --good-wash:#11291b; --warn:#e6b450; --warn-wash:#2c2310; --bad:#f2817b; --bad-wash:#351719;
  --bar:#7f9be0; --bar-low:#f2817b; --track:#1c2742;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.28);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--brand-ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;
  box-shadow:inset -3px 0 0 var(--gold), inset -6px 0 0 var(--side), inset -7px 0 0 var(--gold-line);padding:22px 18px 18px 16px;gap:22px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:58px;height:58px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--gold), 0 0 0 4px var(--side), 0 0 0 5px var(--gold-line)}
.brand-name{font-family:var(--f-display);font-size:24px;letter-spacing:.14em;line-height:1}
.brand-sub{font-size:11.5px;line-height:1.35;color:var(--side-muted);margin-top:5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500;font-size:14.5px;position:relative}
.nav a svg{opacity:.8}
.nav a:hover{background:var(--side-hover)}
.nav a[aria-current="page"]{background:var(--side-hover);color:#fff}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav .badge{margin-left:auto;background:var(--gold);color:#13224a;font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;line-height:18px}
.who{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;display:flex;gap:10px;align-items:center}
.who img,.who-ini{width:34px;height:34px;border-radius:50%;flex:none}
.who-ini{display:grid;place-items:center;background:var(--gold);color:#13224a;font-weight:700}
.who-txt{flex:1;min-width:0}
.who-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .btn-text{color:var(--side-muted);padding:4px 6px}
.who .btn-text:hover{color:#fff}
.person-ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.person-ctl select{width:auto;min-width:170px}
.who-name{font-weight:600;font-size:14px;line-height:1.25}
.who-role{font-size:12px;color:var(--side-muted)}
.who-role b{color:var(--gold);font-weight:600}

.main{min-width:0;padding:28px clamp(16px,3.2vw,40px) 64px}
.page{display:flex;flex-direction:column;gap:22px;max-width:1240px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ph-title{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.4vw,38px);line-height:1.1;margin-top:4px;letter-spacing:.01em}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;border:1px solid transparent;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover:not(:disabled){background:var(--brand-2)}
.btn-gold{background:var(--gold);color:#13224a}
.btn-gold:hover:not(:disabled){filter:brightness(1.05)}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover:not(:disabled){border-color:var(--ink-2)}
.btn-danger{background:var(--bad);color:#fff}
.btn-text{background:none;border:none;color:var(--brand-ink);padding:6px 8px}
.btn-text:hover{text-decoration:underline}
.btn-sm{padding:5px 10px;font-size:13px}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;color:var(--ink)}
.icon-btn:hover{border-color:var(--ink-2)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,26,48,.15), inset 0 0 0 1px var(--line-2)}
.seg button:disabled{cursor:default}
.in{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:38px}
.in:disabled{background:var(--surface-2);color:var(--ink-2)}
textarea.in{min-height:76px;resize:vertical}
.in:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld-l{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fld-h{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wide{grid-column:1/-1}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters .in{width:auto;min-width:160px}
.filters .search{flex:1 1 220px;max-width:340px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--good)}
.switch input:checked::after{transform:translateX(16px)}
.switch input:disabled{opacity:.55;cursor:not-allowed}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 0}
.card-t{font-size:15px;font-weight:700}
.card-s{font-size:12.5px;color:var(--muted)}
.card-b{padding:12px 18px 16px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{position:relative;padding:16px 18px 15px;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gold)}
.kpi::after{content:"";position:absolute;left:0;right:0;top:5px;height:1px;background:var(--gold-line);opacity:.7}
.kpi-l{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-top:2px}
.kpi-v{font-family:var(--f-display);font-size:40px;line-height:1.05;margin-top:6px;color:var(--ink)}
.kpi-v small{font-family:var(--f-body);font-size:15px;color:var(--muted);margin-left:4px}
.kpi-s{font-size:12.5px;color:var(--muted);margin-top:4px}

/* chips & pills */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:999px;line-height:17px;white-space:nowrap}
.t-aula{background:var(--brand);color:var(--on-brand)}
.t-pratica{background:var(--gold-wash);color:var(--gold-ink);box-shadow:inset 0 0 0 1px var(--gold-line)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;line-height:17px;white-space:nowrap}
.s-agendada{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.s-hoje{background:var(--gold-wash);color:var(--gold-ink);box-shadow:inset 0 0 0 1px var(--gold-line)}
.s-pendente{background:var(--warn-wash);color:var(--warn)}
.s-realizada{background:var(--good-wash);color:var(--good)}
.s-cancelada{background:var(--bad-wash);color:var(--bad)}
.s-neutro{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 6px;line-height:18px;white-space:nowrap}
.strike{text-decoration:line-through;color:var(--muted)}

/* activity rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 18px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.rows .row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.dateb{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line-2);border-radius:8px;padding:4px 0 5px;background:var(--surface)}
.dateb-d{font-family:var(--f-display);font-size:22px;line-height:1}
.dateb-w{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.dateb-m{font-size:10.5px;color:var(--muted);line-height:1.1;text-transform:lowercase}
.dateb.is-today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.row-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.row-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row-title{font-weight:600;font-size:15px;line-height:1.3;display:block}
.row-meta{font-size:13px;color:var(--muted);display:block}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.meter{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.meter-t{width:64px;height:6px;border-radius:999px;background:var(--track);overflow:hidden;display:inline-block}
.meter-f{display:block;height:100%;background:var(--gold);border-radius:999px}
.meter.full .meter-f{background:var(--good)}
.pres{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.empty{padding:22px 18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty b{color:var(--ink)}

/* pendências */
.todo{display:flex;flex-direction:column}
.todo-i{display:flex;gap:12px;align-items:flex-start;padding:10px 18px;border-top:1px solid var(--line)}
.todo-i:first-child{border-top:0}
.todo-ic{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center}
.todo-ic.warn{background:var(--warn-wash);color:var(--warn)}
.todo-ic.bad{background:var(--bad-wash);color:var(--bad)}
.todo-ic.good{background:var(--good-wash);color:var(--good)}
.todo-ic.gold{background:var(--gold-wash);color:var(--gold-ink)}
.todo-t{font-size:14px;font-weight:600}
.todo-s{font-size:12.5px;color:var(--muted)}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:15px;border:1px solid var(--gold);color:var(--gold-ink)}
.steps li.done::before{content:"✓";background:var(--good-wash);border-color:var(--good);color:var(--good);font-family:var(--f-body);font-weight:700}
.steps .st-t{font-weight:600;font-size:14px}
.steps .st-s{font-size:12.5px;color:var(--muted)}

/* bars */
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:13px;border-radius:6px;padding:1px 0}
.bar-row:hover .bar-f,.bar-row:focus .bar-f{filter:brightness(1.15)}
.bar-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar-t{position:relative;height:14px;background:var(--track);border-radius:3px}
.bar-f{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.bar-f.low{background:var(--bar-low)}
.bar-lim{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold);transform:translateX(-1px)}
.bar-v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.bar-v .warnmark{color:var(--bad);margin-right:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.lim{width:2px;height:12px;background:var(--gold)}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;box-shadow:var(--shadow);font-size:12.5px;max-width:240px}
.tip strong{display:block;font-size:15px}
.tip span{color:var(--muted)}

/* calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:14px 16px}
.cal-month{font-family:var(--f-display);font-size:24px;min-width:200px}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.cal-dow{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 8px 6px;border-bottom:1px solid var(--line)}
.cal-day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal-day:nth-child(7n){border-right:0}
.cal-day.out{background:var(--surface-2)}
.cal-day.out .cal-n{color:var(--muted);opacity:.7}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--gold)}
.cal-n{font-size:13px;font-weight:600;align-self:flex-start;border:0;background:none;padding:1px 6px;border-radius:999px;cursor:pointer}
.cal-day.today .cal-n{background:var(--brand);color:var(--on-brand)}
.cal-ev{display:block;width:100%;text-align:left;border:0;border-radius:5px;padding:2px 6px;font-size:11.5px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-ev.t-aula{background:var(--brand);color:var(--on-brand)}
.cal-ev.t-pratica{background:var(--gold-wash);color:var(--gold-ink);box-shadow:inset 3px 0 0 var(--gold)}
.cal-ev.cancel{opacity:.55;text-decoration:line-through}
.cal-more{font-size:11.5px;color:var(--muted);padding-left:6px}
.dots{display:none;gap:3px;flex-wrap:wrap;padding-left:4px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.t-aula{background:var(--brand)}
.dot.t-pratica{background:var(--gold);box-shadow:none}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
.tbl th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.mini{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.mini-t{width:56px;height:6px;background:var(--track);border-radius:999px;overflow:hidden}
.mini-f{height:100%;background:var(--bar);border-radius:999px}
.mini-f.low{background:var(--bar-low)}
.nm{font-weight:600}
.nm-s{font-size:12.5px;color:var(--muted)}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--gold)}

/* campos */
.campos{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.campo{padding:16px 18px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--gold)}
.campo.off{opacity:.65;border-top-color:var(--line-2)}
.campo-n{font-weight:700;font-size:16px;line-height:1.3}
.campo-m{font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.campo-m svg{color:var(--muted);flex:none}
.wd{display:flex;gap:4px;flex-wrap:wrap}
.wd span{font-size:11.5px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.wd span.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.campo-a{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,30,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--surface);z-index:50;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s ease;box-shadow:-12px 0 32px rgba(8,14,30,.22);border-left:3px solid var(--gold)}
.drawer.open{transform:none}
.dw-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dw-title{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.15;margin-top:3px}
.dw-body{flex:1;overflow-y:auto;padding:18px 20px 26px;display:flex;flex-direction:column;gap:20px}
.dw-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.dw-foot .sp{flex:1}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-t{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.note.gold{background:var(--gold-wash);border-color:var(--gold-line);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;font-weight:500}
.pchip button{border:0;background:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.pchip button:hover{background:var(--line);color:var(--ink)}
.pchip.ro{padding-right:10px}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow-n{font-size:14px;min-width:0}
.prow-n .tag{margin-left:6px}
.pseg{display:inline-flex;gap:3px}
.pseg button{width:34px;height:30px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-2)}
.pseg button:disabled{cursor:default}
.pseg button[aria-pressed="true"].P{background:var(--good);border-color:var(--good);color:#fff}
.pseg button[aria-pressed="true"].F{background:var(--bad);border-color:var(--bad);color:#fff}
.pseg button[aria-pressed="true"].J{background:var(--warn);border-color:var(--warn);color:#fff}
.pres-sum{display:flex;gap:12px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.pres-sum b{font-variant-numeric:tabular-nums}
.wdpick{display:flex;gap:5px;flex-wrap:wrap}
.wdpick button{min-width:44px;height:34px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-2)}
.wdpick button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.hist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px}
.hist-i{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:13.5px;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;cursor:pointer}
.hist-i:first-child{border-top:0}
.hist-i:hover{background:var(--surface-2)}
.hist-d{color:var(--muted);font-variant-numeric:tabular-nums}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat-v{font-family:var(--f-display);font-size:26px;line-height:1.1}
.stat-l{font-size:12px;color:var(--muted)}
.modal-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(8,14,30,.45)}
.modal{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);border-top:3px solid var(--gold)}
.modal .dw-head{border-bottom:1px solid var(--line)}
.modal .dw-body{overflow:visible}
.prev{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;font-size:13px}
.prev div{padding:6px 10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.prev div:first-child{border-top:0}

/* banners & toasts */
#banners{display:flex;flex-direction:column;gap:10px;max-width:1240px}
#banners:not(:empty){margin-bottom:18px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-size:14px}
.banner.gold{background:var(--gold-wash);border-color:var(--gold-line)}
.banner.warn{background:var(--warn-wash);border-color:transparent;color:var(--ink)}
.banner.bad{background:var(--bad-wash);border-color:transparent}
.banner .grow{flex:1 1 260px}
.banner select{width:auto;min-width:200px}
.toasts{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);max-width:380px;border-left:4px solid var(--gold)}
.toast.bad{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}
.toast.good{border-left-color:var(--good)}

/* permissions */
.mtx{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.mtx th,.mtx td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center}
.mtx th:first-child,.mtx td:first-child{text-align:left}
.mtx thead th{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;vertical-align:bottom}
.mtx tbody tr:last-child td{border-bottom:0}
.lock{font-size:12px;color:var(--muted)}
.people{display:flex;flex-direction:column}
.person{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person img{width:36px;height:36px;border-radius:50%}
.person select{width:auto;min-width:190px}
.person.pend{background:var(--gold-wash)}
.srch{position:relative}
.srch-res{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);z-index:5;overflow:hidden}
.srch-res button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;text-align:left;cursor:pointer}
.srch-res button:hover{background:var(--surface-2)}
.srch-res img{width:26px;height:26px;border-radius:50%}
.layers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.layer{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--surface-2)}
.layer-t{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.layer p{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.howto{margin:0;padding-left:20px;font-size:13.5px;color:var(--ink-2);display:grid;gap:4px}
.preview-roles{display:flex;gap:8px;flex-wrap:wrap}

.loading{padding:60px 0;color:var(--muted);display:flex;gap:12px;align-items:center}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--gold);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal-wrap{grid-template-columns:1fr}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column;gap:12px;padding:14px 16px 10px;box-shadow:inset 0 -3px 0 var(--gold), inset 0 -6px 0 var(--side), inset 0 -7px 0 var(--gold-line)}
  .seal{width:44px;height:44px}
  .brand-name{font-size:20px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none}
  .nav a{white-space:nowrap;padding:7px 11px;font-size:14px}
  .nav a[aria-current="page"]::before{left:10px;right:10px;top:auto;bottom:0;width:auto;height:3px;border-radius:3px 3px 0 0}
  .who{margin-top:0;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
  .cols{grid-template-columns:1fr}
  .main{padding-top:20px}
}
@media (max-width:640px){
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi-v{font-size:32px}
  .grid2,.grid3,.layers{grid-template-columns:1fr}
  .row{grid-template-columns:50px minmax(0,1fr);padding:11px 14px}
  .row-side{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}
  .cal-day{min-height:58px;padding:4px}
  .cal-ev,.cal-more{display:none}
  .dots{display:flex}
  .cal-dow{padding:6px 4px;font-size:10.5px;text-align:center}
  .cal-n{align-self:center}
  .person{grid-template-columns:36px minmax(0,1fr);}
  .person-ctl,.person .btn{grid-column:2;justify-content:flex-start}
  .statgrid{grid-template-columns:1fr 1fr}
  .filters .in{min-width:0;flex:1 1 140px}
  .bar-row{grid-template-columns:96px minmax(0,1fr) 46px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>

(() => {
  const tip = $('#tip');
  const show = (el, x, y) => {
    tip.replaceChildren(h('strong', null, el.dataset.tipV), h('span', null, el.dataset.tipL));
    tip.hidden = false;
    const r = tip.getBoundingClientRect();
    let left = x + 14, top = y - r.height - 10;
    if (left + r.width > innerWidth - 8) left = x - r.width - 14;
    if (top < 8) top = y + 16;
    tip.style.left = Math.max(8, left) + 'px'; tip.style.top = top + 'px';
  };
  document.addEventListener('pointermove', e => {
    const el = e.target.closest && e.target.closest('[data-tip-v]');
    if (el) show(el, e.clientX, e.clientY); else tip.hidden = true;
  });
  document.addEventListener('focusin', e => {
    const el = e.target.closest && e.target.closest('[data-tip-v]');
    if (el) { const r = el.getBoundingClientRect(); show(el, r.left + r.width * 0.6, r.top); } else tip.hidden = true;
  });
  document.addEventListener('scroll', () => { tip.hidden = true; }, true);
})();

      h('span', { class: 'dot t-' + tp, style: 'display:inline-block;margin-right:6px;vertical-align:middle' }), tp === 'aula' ? 'Aulas fechadas' : 'Práticas')));
  const calCard = h('section', { class: 'card' },
    h('div', { class: 'cal-head' },
      h('div', { class: 'cal-nav' }, h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Mês anterior', onclick: () => mudarMes(-1) }, ic('left')),
        h('h2', { class: 'cal-month', 'aria-live': 'polite' }, nomeMes),
        h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Próximo mês', onclick: () => mudarMes(1) }, ic('right')),
        btn('Hoje', () => { const d = new Date(); S.mes = { y: d.getFullYear(), m: d.getMonth() }; S.diaSel = hoje(); agendar(); }, { sm: true })),
      filtro),
    grid);

  const evDia = (porDia.get(S.diaSel) || []);
  const podeCriar = pode('aulas') || pode('praticas');
  const diaCard = card(fmt(S.diaSel, { weekday: 'long', day: 'numeric', month: 'long' }), evDia.length ? plural(evDia.length, 'atividade', 'atividades') : 'Dia livre',

      podeCriar ? h('div', { class: 'filters', style: 'padding:12px 18px 16px;border-top:1px solid var(--line)' },
        pode('aulas') ? btn('Aula fechada', () => gavetaAtividade(null, { tipo: 'aula', data: S.diaSel }), { sm: true, icon: 'plus', kind: 'primary' }) : null,
        pode('praticas') ? btn('Prática', () => gavetaAtividade(null, { tipo: 'pratica', data: S.diaSel }), { sm: true, icon: 'plus' }) : null) : null),
    { flush: true, id: 'dia-selecionado' });

  return h('div', { class: 'page' },
    pageHead('Agenda', 'Aulas fechadas e dias de prática', [pode('campos') && S.campos.size ? btn('Gerar dias de prática', () => modalGerar(), { icon: 'shuffle' }) : null]),

/* ================= gaveta e modal ================= */
let focoAntes = null;
function abrirGaveta({ titulo, sub, corpo, rodape }) {
  const d = $('#drawer');
  const jaAberta = d.classList.contains('open');
  const corpoAnt = d.querySelector('.dw-body');
  const scroll = jaAberta && corpoAnt ? corpoAnt.scrollTop : 0;
  const ae = document.activeElement;
  const fid = jaAberta && ae && ae.id && d.contains(ae) ? ae.id : null;
  d.replaceChildren(
    h('div', { class: 'dw-head' }, h('div', null, sub ? h('div', { class: 'eyebrow' }, sub) : null, h('h2', { class: 'dw-title', id: 'drawer-title' }, titulo)),
      h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Fechar', onclick: fecharGaveta }, ic('x'))),
    h('div', { class: 'dw-body' }, corpo),
    rodape ? h('div', { class: 'dw-foot' }, rodape) : null);
  d.querySelector('.dw-body').scrollTop = scroll;
  if (!jaAberta) {
    focoAntes = document.activeElement;
    d.classList.add('open'); d.setAttribute('aria-hidden', 'false'); $('#scrim').hidden = false;
    setTimeout(() => { const f = d.querySelector('.dw-body input:not([disabled]), .dw-body select:not([disabled]), .dw-body textarea:not([disabled])'); (f || d.querySelector('.icon-btn')).focus({ preventScroll: true }); }, 60);
  } else if (fid) { const el = document.getElementById(fid); if (el) el.focus({ preventScroll: true }); }
}
function fecharGaveta() {
  const d = $('#drawer');
  d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); $('#scrim').hidden = true;
  setTimeout(() => { if (!d.classList.contains('open')) d.replaceChildren(); }, 250);
  if (focoAntes && document.contains(focoAntes)) focoAntes.focus({ preventScroll: true });
}
$('#scrim').addEventListener('click', fecharGaveta);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#modal').hidden) fecharModal(); else if ($('#drawer').classList.contains('open')) fecharGaveta();
});
function abrirModal({ titulo, corpo, rodape }) {
  const m = $('#modal');
  m.replaceChildren(h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'modal-title' },
    h('div', { class: 'dw-head' }, h('h2', { class: 'dw-title', id: 'modal-title' }, titulo), h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Fechar', onclick: fecharModal }, ic('x'))),

  m.hidden = false;

}
function fecharModal() { $('#modal').hidden = true; $('#modal').replaceChildren(); }
function botaoExcluir(rotulo, acao) {

    const dados = h('div', { class: 'grid2' });

    corpo.push(h('div', { class: 'sec' }, h('div', { class: 'sec-t' }, 'Dados'), !ed ? h('div', { class: 'note' }, 'Somente leitura para o seu papel.') : null, dados,
      !ed && f.link && /^https?:\/\//.test(f.link) ? h('a', { href: f.link, target: '_blank', rel: 'noopener' }, 'Abrir material da aula') : null));

    // escala
    if (f.tipo === 'pratica' && veEscalas()) {
      const esc = f.escalados.map(i => S.membros.get(i)).filter(Boolean);
      const ocup = ocupadosEm(f.data, orig && orig.id);
      const disponiveis = membrosAtivos().filter(m => !f.escalados.includes(m.id) && publicoInclui(f.publico, m.categoria));
      const vagas = Number(f.vagas) || 0;
      corpo.push(h('div', { class: 'sec' },
        h('div', { class: 'sec-h' }, h('div', { class: 'sec-t' }, 'Escala'), meterEscala(f)),
        esc.length ? h('div', { class: 'chips', id: 'escala-chips' }, esc.map(m => h('span', { class: 'pchip' + (ed ? '' : ' ro') }, m.nome,
          ed ? h('button', { type: 'button', 'aria-label': 'Tirar ' + m.nome + ' da escala', onclick: () => { f.escalados = f.escalados.filter(x => x !== m.id); sujo = true; desenhar(); } }, ic('x', 14)) : null)))
          : h('div', { class: 'card-s' }, 'Ninguém escalado ainda.'),
        ed ? h('div', { class: 'filters' },
          sel('esc-add', '', [['', 'Adicionar membro…'], ...disponiveis.map(m => [m.id, m.nome + (ocup.has(m.id) ? ' (já escalado neste dia)' : '')])], {
            aria: 'Adicionar membro à escala', onchange: e => { if (e.target.value) { f.escalados = [...f.escalados, e.target.value]; sujo = true; desenhar(); } }
          }),
          btn('Completar com rodízio', () => {
            const ids = sugerirEscala({ data: f.data, vagas, publico: f.publico, ja: f.escalados, carga: cargaPraticas(orig && orig.id), ocupados: ocup });
            if (!vagas) { toast('Defina o número de vagas primeiro.', 'warn'); return; }
            if (!ids.length) { toast(f.escalados.length >= vagas ? 'A escala já está completa.' : 'Não há membros disponíveis para este público.', 'warn'); return; }
            f.escalados = [...f.escalados, ...ids]; sujo = true; desenhar();
          }, { icon: 'shuffle', sm: true, title: 'Escolhe quem tem menos práticas e está há mais tempo sem escala' })) : null));
    }

    // presença
    if (!novo && (veFreqTodos() || podePres())) {
      const ep = podePres();
      const lista = esperados(f);
      const c = { P: 0, F: 0, J: 0 };
      for (const v of Object.values(f.presencas)) if (v in c) c[v]++;
      const outros = membrosAtivos().filter(m => !lista.some(x => x.id === m.id));
      corpo.push(h('div', { class: 'sec', id: 'sec-presenca' },
        h('div', { class: 'sec-h' }, h('div', { class: 'sec-t' }, 'Presença'),
          ep && lista.length ? h('span', { style: 'display:inline-flex;gap:4px' },
            btn('Todos presentes', () => { for (const m of lista) f.presencas[m.id] = 'P'; sujo = true; desenhar(); }, { sm: true, icon: 'check' }),
            btn('Limpar', () => { f.presencas = {}; sujo = true; desenhar(); }, { sm: true, kind: 'text' })) : null),
        h('div', { class: 'pres-sum' }, h('span', null, h('b', null, c.P), ' presentes'), h('span', null, h('b', null, c.F), ' faltas'), h('span', null, h('b', null, c.J), ' justificadas'), h('span', null, h('b', null, lista.length - c.P - c.F - c.J), ' sem registro')),
        lista.length ? h('div', { class: 'plist' }, lista.map(m => {
          const v = f.presencas[m.id];
          return h('div', { class: 'prow' },
            h('span', { class: 'prow-n' }, m.nome, h('span', { class: 'tag' }, CATEG[m.categoria] || '')),
            h('span', { class: 'pseg', role: 'group', 'aria-label': 'Presença de ' + m.nome },
              ['P', 'F', 'J'].map(k => h('button', { type: 'button', class: k, 'aria-pressed': String(v === k), title: { P: 'Presente', F: 'Falta', J: 'Falta justificada' }[k], disabled: !ep,
                onclick: () => { if (f.presencas[m.id] === k) delete f.presencas[m.id]; else f.presencas[m.id] = k; sujo = true; desenhar(); } }, k))));
        })) : h('div', { class: 'card-s' }, f.tipo === 'pratica' ? 'Monte a escala para lançar a presença.' : 'Nenhum membro ativo neste público.'),

      (podeDados() || (!novo && podePres())) ? btn(novo ? 'Criar' : 'Salvar', salvar, { kind: 'primary', id: 'at-salvar' }) : btn('Fechar', fecharGaveta)
    ];
    const subt = orig && orig.atualizadoEm ? `Atualizado em ${fmtCurta(orig.atualizadoEm.slice(0, 10))}${orig.atualizadoPor ? ' por ' + orig.atualizadoPor : ''}` : (novo ? 'Nova atividade' : TIPOS[f.tipo]);
    abrirGaveta({ titulo: novo ? (f.tipo === 'aula' ? 'Nova aula fechada' : 'Nova prática') : tituloAt(f), sub: subt, corpo, rodape });
  }

  async function salvar() {
    if (!validISO(f.data)) { toast('Informe a data.', 'warn'); return; }
    const presAntes = JSON.stringify((orig && orig.presencas) || {});
    const presMudou = !novo && JSON.stringify(f.presencas) !== presAntes;
    const temPres = Object.keys(f.presencas || {}).length > 0;
    const nid = orig ? orig.id : novoId(f.tipo === 'aula' ? 'aula' : 'pr');
    let auto = false;
    if (podeDados()) {
      if (f.tipo === 'aula' && !String(f.titulo).trim()) { toast('Informe o tema da aula.', 'warn'); document.getElementById('at-titulo')?.focus(); return; }
      if (f.tipo === 'pratica' && !f.campoId && !String(f.titulo).trim()) { toast('Escolha o campo de prática ou dê um título.', 'warn'); return; }
    } else if (!presMudou) { fecharGaveta(); return; }
    const btnS = document.getElementById('at-salvar'); if (btnS) btnS.disabled = true;
    try {
      if (podeDados()) {
        const doc = {
          tipo: f.tipo, titulo: String(f.titulo || '').trim(), data: f.data, inicio: f.inicio || '', fim: f.fim || '',
          local: String(f.local || '').trim(), responsavel: String(f.responsavel || '').trim(), publico: f.publico || 'todos',
          campoId: f.tipo === 'pratica' ? (f.campoId || '') : '', vagas: f.tipo === 'pratica' ? (f.vagas === '' ? 0 : Number(f.vagas) || 0) : 0,
          escalados: f.tipo === 'pratica' ? f.escalados : [], status: f.status || 'agendada',
          obs: String(f.obs || ''), link: f.tipo === 'aula' ? String(f.link || '').trim() : '',
          criadoEm: orig ? orig.criadoEm || null : null, criadoPor: orig ? orig.criadoPor || null : null
        };
        if (presMudou && temPres && doc.status === 'agendada' && doc.data <= hoje() && podePres()) { doc.status = 'realizada'; auto = true; }
        carimbo(doc, novo);
        await gravar(`atividades/${nid}`, doc);
      }
      if (presMudou && podePres()) {
        await gravar(`presencas/${nid}`, { registros: f.presencas, atualizadoEm: new Date().toISOString(), atualizadoPor: quemSou() });
        if (!podeDados() && temPres && orig.status === 'agendada' && orig.data <= hoje()) {
          await gravar(`atividades/${nid}`, { status: 'realizada', atualizadoEm: new Date().toISOString(), atualizadoPor: quemSou() }, { atualizar: true });
          auto = true;
        }
      }
      toast(novo ? 'Atividade criada.' : auto ? 'Presença lançada e atividade marcada como realizada.' : 'Alterações salvas.', 'good');
      if (novo) { S.atRaw.set(nid, { ...(S.atRaw.get(nid) || {}), tipo: f.tipo, titulo: f.titulo, data: f.data, inicio: f.inicio, fim: f.fim, local: f.local, responsavel: f.responsavel, publico: f.publico, campoId: f.campoId, vagas: f.vagas, escalados: f.escalados, status: f.status, obs: f.obs, link: f.link, id: nid }); mesclar(); gavetaAtividade(nid); }
      else fecharGaveta();
    } catch { if (btnS) btnS.disabled = false; }
  }
  async function excluir() {
    try {
      await gravar(`atividades/${orig.id}`, null, { apagar: true });
      if (S.presRaw.has(orig.id) && pode('presencas')) await gravar(`presencas/${orig.id}`, null, { apagar: true }).catch(() => {});
      toast('Atividade excluída.'); fecharGaveta();
    } catch { /* tratado */ }
  }
  desenhar();
}

function gavetaMembro(id) {

  const orig = id ? S.membros.get(id) : null;

/* ---------- modal: gerar dias de prática ---------- */
function modalGerar(campoId) {
  const ativos = [...S.campos.values()].filter(c => c.ativo !== false).sort(porNome);
  if (!ativos.length) { toast('Cadastre um campo de prática ativo primeiro.', 'warn'); return; }
  const st = { campo: campoId || 'todos', de: hoje(), ate: addDias(hoje(), 27), auto: true, criando: false };
  function plano() {
    const lista = [];
    if (!validISO(st.de) || !validISO(st.ate) || st.ate < st.de) return { lista, dup: 0 };
    const alvo = st.campo === 'todos' ? ativos : ativos.filter(c => c.id === st.campo);
    let dup = 0;
    for (let d = st.de, n = 0; d <= st.ate && n < 400; d = addDias(d, 1), n++) {
      const dow = parseISO(d).getDay();
      for (const c of alvo) {
        if (!(c.dias || []).includes(dow)) continue;
        const pid = `pr-${c.id}-${d}`;
        if (S.atividades.has(pid) || [...S.atividades.values()].some(a => a.tipo === 'pratica' && a.campoId === c.id && a.data === d && a.status !== 'cancelada')) { dup++; continue; }
        lista.push({ c, d, pid });
      }
    }
    return { lista, dup };
  }
  function desenhar() {
    const { lista, dup } = plano();
    const corpo = [
      field('Campo de prática', sel('ger-campo', st.campo, [['todos', 'Todos os campos ativos'], ...ativos.map(c => [c.id, c.nome])], { onchange: e => { st.campo = e.target.value; desenhar(); } })),
      h('div', { class: 'grid2' },
        field('De', inp('ger-de', st.de, { type: 'date', onchange: e => { st.de = e.target.value; desenhar(); } })),
        field('Até', inp('ger-ate', st.ate, { type: 'date', onchange: e => { st.ate = e.target.value; desenhar(); } }))),
      h('label', { class: 'switch' }, h('input', { type: 'checkbox', id: 'ger-auto', checked: st.auto, onchange: e => { st.auto = e.target.checked; } }),
        h('span', null, 'Montar a escala automaticamente (rodízio equilibrado)')),
      h('div', { class: 'fld-h' }, 'O rodízio escolhe primeiro quem tem menos práticas e está há mais tempo sem escala, respeitando o público do campo e sem repetir a pessoa no mesmo dia.'),
      lista.length ? h('div', { class: 'sec' }, h('div', { class: 'sec-t' }, `${plural(lista.length, 'dia será criado', 'dias serão criados')}${dup ? ` · ${plural(dup, 'já existia', 'já existiam')}` : ''}`),
        h('div', { class: 'prev' }, lista.slice(0, 60).map(x => h('div', null, h('span', null, fmt(x.d, { weekday: 'short', day: '2-digit', month: '2-digit' })), h('span', { class: 'card-s' }, x.c.nome)))))
        : h('div', { class: 'note' }, dup ? 'Todos os dias deste período já estão cadastrados.' : 'Nenhum dia do período coincide com os dias da semana do campo.')
    ];
    abrirModal({ titulo: 'Gerar dias de prática', corpo, rodape: [h('span', { class: 'sp' }), btn('Cancelar', fecharModal), btn(st.criando ? 'Criando…' : `Criar ${lista.length || ''} ${lista.length === 1 ? 'dia' : 'dias'}`.replace('  ', ' '), () => criar(lista), { kind: 'primary', disabled: !lista.length || st.criando, id: 'ger-criar' })] });
  }
  async function criar(lista) {
    st.criando = true; desenhar();
    const carga = cargaPraticas();
    const ocupDia = new Map();
    let ok = 0;
    for (const { c, d, pid } of lista) {
      let esc = [];
      if (st.auto) {
        if (!ocupDia.has(d)) ocupDia.set(d, ocupadosEm(d));
        const oc = ocupDia.get(d);
        esc = sugerirEscala({ data: d, vagas: c.vagas, publico: c.publico, carga, ocupados: oc });
        for (const id of esc) { carga.c.set(id, (carga.c.get(id) || 0) + 1); carga.ult.set(id, d); oc.add(id); }
      }
      const doc = carimbo({ tipo: 'pratica', titulo: '', campoId: c.id, data: d, inicio: c.inicio || '', fim: c.fim || '', local: c.local || '', responsavel: c.preceptor || '', publico: c.publico || 'todos', vagas: Number(c.vagas) || 0, escalados: esc, status: 'agendada', obs: '', link: '' }, true);
      try { await gravar(`atividades/${pid}`, doc); ok++; } catch { break; }
      const b = document.getElementById('ger-criar'); if (b) b.lastChild.textContent = `Criando… ${ok}/${lista.length}`;
    }
    fecharModal();
    if (ok) toast(`${plural(ok, 'dia de prática criado', 'dias de prática criados')}${st.auto ? ' com escala montada' : ''}.`, 'good');
  }
  desenhar();
}

/* ================= exportações ================= */
function csv(rows) {
  return '﻿' + rows.map(r => r.map(c => { const s = c == null ? '' : String(c); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n');
}
function baixar(nome, dados) {
  try {
    const tipo = nome.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'text/html;charset=utf-8';
    const url = URL.createObjectURL(new Blob([dados], { type: tipo }));
    const a = h('a', { href: url, download: nome, style: 'display:none' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch { toast('Não foi possível gerar o arquivo neste navegador.', 'bad'); }
}
function exportarFrequencia() {
  const rows = [['Nome', 'Categoria', 'Período', 'Cargo', 'Situação', 'Aulas: presenças', 'Aulas: faltas', 'Aulas: justificadas', 'Frequência nas aulas (%)', 'Práticas: presenças', 'Práticas: faltas', 'Práticas: justificadas', 'Escalas (total)', 'Escalas futuras']];
  for (const m of [...S.membros.values()].sort(porNome)) {
    const s = S.stats.get(m.id) || {};
    rows.push([m.nome, CATEG[m.categoria] || '', m.periodo || '', m.cargo || '', m.status === 'inativo' ? 'Inativo' : 'Ativo', s.aP || 0, s.aF || 0, s.aJ || 0, s.freqAulas ?? '', s.pP || 0, s.pF || 0, s.pJ || 0, s.escalas || 0, (s.futuras || []).length]);
  }
  baixar(`laortt-frequencia-${hoje()}.csv`, csv(rows));
}
function exportarAtividades(lista) {
  const rows = [['Data', 'Início', 'Fim', 'Tipo', 'Título', 'Local', 'Responsável', 'Público', 'Vagas', 'Escalados', 'Presentes', 'Faltas', 'Justificadas', 'Situação']];

  }
  baixar(`laortt-atividades-${hoje()}.csv`, csv(rows));
}

}

/* ================= início ================= */
function iniciar() {
  lerRota();
  render();
  const cfgOk = typeof FIREBASE_CONFIG === 'object' && FIREBASE_CONFIG.apiKey && !/^COLE/.test(FIREBASE_CONFIG.apiKey);
  if (!window.firebase || !cfgOk) { S.semConfig = true; S.semDb = true; render(); return; }
  let db;
  try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); S.auth = firebase.auth(); }
  catch (e) { console.error(e); S.semConfig = true; S.semDb = true; render(); return; }
  try { const p = db.enablePersistence({ synchronizeTabs: true }); if (p && p.catch) p.catch(() => {}); } catch { /* cache local indisponível */ }
  S.db = db;
  const negado = e => { if (e && e.code === 'permission-denied') S.semRegras = true; };
  ouvir(db.collection('membros'), s => { S.membros = mapaDe(s); S.loaded.membros = true; S.semRegras = false; agendar(); }, e => { negado(e); S.loaded.membros = true; });
  ouvir(db.collection('atividades'), s => { S.atRaw = mapaDe(s); mesclar(); S.loaded.atividades = true; agendar(); }, e => { negado(e); S.loaded.atividades = true; });
  ouvir(db.collection('campos'), s => { S.campos = mapaDe(s); S.loaded.campos = true; agendar(); }, e => { negado(e); S.loaded.campos = true; });
  ouvir(db.doc('config/papeis'), s => { S.configRaw = s.exists ? s.data() : null; S.config = mergeConfig(S.configRaw); S.loaded.config = true; assinarPrivados(); agendar(); }, e => { negado(e); S.loaded.config = true; });
  ouvir(db.doc('config/instalacao'), s => { S.instalado = !!s.exists; agendar(); }, negado);
  try { const r = S.auth.getRedirectResult(); if (r && r.catch) r.catch(erroLogin); } catch { /* sem redirecionamento */ }
  S.auth.onAuthStateChanged(u => {
    S.authUser = u || null;
    S.email = u && u.email ? u.email.toLowerCase() : null;
    S.previa = null;
    trocarAcesso();
    agendar();
  });
  setTimeout(() => { if (!(S.loaded.membros && S.loaded.atividades && S.loaded.config)) { S.lento = true; agendar(); } }, 10000);
}
iniciar();
})();
</script>
